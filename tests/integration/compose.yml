# A throwaway single-node Elasticsearch + Kibana for the integration tests,
# started and removed by scripts/integration.sh. Security on (roles and
# role mappings need it), TLS off, basic license: the homelab's features,
# nothing more. Ports bind to localhost only.
#
# The passwords and the encryption key come from the script's environment,
# random per run: nothing here is a secret.
name: elasticstack-workspace-it

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - 127.0.0.1:9200:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 5s
      timeout: 10s
      retries: 60

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    # Started once the script has set kibana_system's password.
    profiles: [kibana]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?}
      # Alerting rules and connectors are encrypted saved objects.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?}
      # Only for the healthcheck below.
      HEALTHCHECK_PASSWORD: ${ELASTIC_PASSWORD:?}
    ports:
      - 127.0.0.1:5601:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu elastic:$$HEALTHCHECK_PASSWORD http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 5s
      timeout: 10s
      retries: 60
