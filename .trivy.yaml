---
# Trivy configuration for IaC scanning
# See https://aquasecurity.github.io/trivy/latest/docs/references/configuration/

# Scan settings
scan:
  # Skip files and directories
  skip-dirs:
    - .git
    - .github
    - .terraform
    - node_modules
    - .venv
    - .ansible
    - .vscode
    - .external_modules

  skip-files:
    - "**/*.md"
    - "**/.gitignore"
    - "**/package-lock.json"

# Severity levels to report
severity:
  - CRITICAL
  - HIGH
  - MEDIUM
  - LOW

# Vulnerability settings
vulnerability:
  type:
    - os
    - library

# Misconfiguration settings
misconfiguration:
  # Scan for misconfigurations
  enabled: true

  # IaC types to scan: only OpenTofu, against the elastic/elasticstack
  # provider. Trivy has no builtin policy pack for it, so this mostly
  # catches hard-coded secrets and generic misconfigurations.
  scanners:
    - terraform

  # No custom policies yet (core keeps its Proxmox ones in policies/trivy).

  # Trace policy evaluation (for debugging)
  trace: false

  # Include deprecated checks
  include-deprecated-checks: false

# Secret scanning
secret:
  enabled: true

# License scanning (optional)
license:
  enabled: false

# Output format
format: table

# Exit code
# 0: no vulnerabilities found
# 1: vulnerabilities found
exit-code: 1

# Ignore unfixed vulnerabilities
ignore-unfixed: false

# Timeout for scan
timeout: 5m

# Cache settings
# Note: Cache dir is set via --cache-dir flag in pre-commit and CI
# to avoid issues with tilde expansion in YAML config

# Skip checks by ID
skip-policy-update: false

# Custom checks to skip (if needed)
# skip-checks:
#   - AVD-VMWARE-0001  # Example: skip a specific check by AVD ID

# Compliance standards to check against
# compliance: cis-1.6

# Helm settings (if scanning Helm charts)
# helm:
#   values:
#     - values.yaml

# File patterns to include
# file-patterns:
#   - "*.tf"
#   - "*.yaml"
#   - "*.yml"

# Reporting settings
# report: all  # all, summary

# Dependency tree
# dependency-tree: true

# List all packages
# list-all-pkgs: false
